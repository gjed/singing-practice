<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vocalizzi — player on a phone, night theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;family=Special+Elite&amp;display=swap">
<style>
body{margin:0;background:#1a1512}
a{color:#f0a3a8}a:hover{color:#f1e9de}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1a1512; color: #f1e9de; font: 400 15px/1.5 'Courier Prime', 'Courier New', monospace; padding: 14px 10px; overflow: hidden">
<div style="height: 100%; box-sizing: border-box; background: #241d19; border: 1.5px solid #f1e9de; display: flex; flex-direction: column; overflow: hidden">
  <header style="border-bottom: 1.5px solid #f1e9de; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
    <a href="Main.dc.html" style="display: flex; align-items: baseline; gap: 8px; text-decoration: none">
      <span style="font: 400 17px/1 'Special Elite', monospace; color: #f1e9de">Vocalizzi</span>
      <span style="font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #f0a3a8">vocal ex.</span>
    </a>
    <button type="button" aria-pressed="true" style="font: 400 10px 'Courier Prime', monospace; letter-spacing: 0.16em; text-transform: uppercase; padding: 5px 8px; min-height: 30px; background: transparent; border: 1px solid #45382f; color: #b3a597">Day</button>
  </header>

  <main style="flex: 1; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <a href="Main.dc.html" style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #b3a597; text-decoration: none; min-height: 24px">← All exercises</a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #9cbcf0">Range · Beginner</span>
      <h1 style="margin: 0; font: 400 30px/1.08 'Special Elite', monospace">Major arpeggio</h1>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #b3a597; border-bottom: 2px solid #9cbcf0; padding-bottom: 6px">
      <span>Now singing</span><span style="color: #9cbcf0">3 / 20</span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 18px">
      <span style="font: 400 22px 'Special Elite', monospace; color: #b3a597">C#3</span>
      <span style="font: 400 76px/1 'Special Elite', monospace">D3</span>
      <span style="font: 400 22px 'Special Elite', monospace; color: #b3a597">D#3</span>
    </div>
    <div aria-label="Run progress" style="display: flex; gap: 3px; align-items: flex-end">
      <span style="flex: 1; height: 8px; background: #f1e9de"></span><span style="flex: 1; height: 8px; background: #f1e9de"></span><span style="flex: 1; height: 16px; background: #9cbcf0"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span><span style="flex: 1; height: 8px; background: #45382f"></span>
    </div>

    <div style="position: relative; height: 132px; background: #2d2520; border: 1.5px solid #f1e9de">
      <div style="position: absolute; left: 0; right: 0; top: 22px; border-top: 1px solid #45382f"></div>
      <div style="position: absolute; left: 0; right: 0; top: 44px; border-top: 1px solid #45382f"></div>
      <div style="position: absolute; left: 0; right: 0; top: 66px; border-top: 1px solid #45382f"></div>
      <div style="position: absolute; left: 0; right: 0; top: 88px; border-top: 1px solid #45382f"></div>
      <div style="position: absolute; left: 0; right: 0; top: 110px; border-top: 1px solid #45382f"></div>
      <div style="position: absolute; left: 4%; width: 15%; top: 98px; height: 24px; box-sizing: border-box; border: 1.5px solid #f1e9de; background: #241d19; font: 700 12px 'Courier Prime', monospace; display: grid; place-items: center">RE</div>
      <div style="position: absolute; left: 21%; width: 15%; top: 74px; height: 24px; box-sizing: border-box; border: 1.5px solid #f1e9de; background: #9cbcf0; color: #1a1512; font: 700 12px 'Courier Prime', monospace; display: grid; place-items: center; box-shadow: 3px 3px 0 #f0a3a8; transform: translate(-2px, -2px)">FA#</div>
      <div style="position: absolute; left: 38%; width: 15%; top: 50px; height: 24px; box-sizing: border-box; border: 1.5px solid #f1e9de; background: #241d19; font: 700 12px 'Courier Prime', monospace; display: grid; place-items: center">LA</div>
      <div style="position: absolute; left: 55%; width: 15%; top: 74px; height: 24px; box-sizing: border-box; border: 1.5px solid #f1e9de; background: #241d19; font: 700 12px 'Courier Prime', monospace; display: grid; place-items: center">FA#</div>
      <div style="position: absolute; left: 72%; width: 24%; top: 98px; height: 24px; box-sizing: border-box; border: 1.5px solid #f1e9de; background: #241d19; font: 700 12px 'Courier Prime', monospace; display: grid; place-items: center">RE</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #b3a597">Vowel</span>
      <span style="font: italic 400 26px 'Courier Prime', monospace">“ah”</span>
    </div>
    <button type="button" style="background: #9cbcf0; color: #1a1512; font: 400 13px 'Courier Prime', monospace; letter-spacing: 0.16em; text-transform: uppercase; min-height: 56px; border: none">■ Stop</button>
  </main>

  <section aria-label="Settings" style="border-top: 1.5px solid #f1e9de; background: #2d2520; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #b3a597">Settings ▴</span>
      <span style="font-size: 12px; color: #f1e9de">A2–E4 · 100 bpm · up–down</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; letter-spacing: 0.1em; color: #b3a597">
      <span>v1.4.0</span>
      <a href="https://github.com/gjed" style="display: inline-flex; align-items: center; gap: 6px; color: #b3a597; text-decoration: none">made by <img src="../../brand/gjed-mark-dark.svg" alt="" style="height: 24px; width: auto"><span style="color: #f1e9de">gjed</span></a>
    </div>
  </section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
