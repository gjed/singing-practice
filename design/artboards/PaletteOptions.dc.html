<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vocalizzi — orange and red palette options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;family=Special+Elite&amp;display=swap">
<style>
body{margin:0;background:#f3efe9}
</style>
</helmet>
<div style="width: 1880px; box-sizing: border-box; padding: 40px; background: #f3efe9; font: 400 15px/1.5 'Courier Prime', 'Courier New', monospace; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px">
  <sc-for list="{{palettes}}" as="p" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; gap: 14px; color: #1d1d1d">
        <span style="font: 400 28px 'Special Elite', monospace">{{p.name}}</span>
        <span style="font-size: 14px; color: #555555">{{p.note}}</span>
      </div>
      <div style="{{p.deskStyle}}">
        <div style="{{p.sheetStyle}}">
          <div style="{{p.mastStyle}}">
            <span style="display: flex; align-items: baseline; gap: 9px"><span style="font: 400 18px/1 'Special Elite', monospace">Vocalizzi</span><span style="{{p.tagStyle}}">vocal exercises</span></span>
            <span style="{{p.navStyle}}">Editor · My range · EN / IT</span>
          </div>
          <div style="{{p.slabStyle}}">
            <div style="{{p.staffStyle}}"></div>
            <div style="position: relative; display: flex; flex-direction: column; gap: 10px; max-width: 440px">
              <span style="{{p.kickerStyle}}">Pick · set your range · sing</span>
              <span style="{{p.titleStyle}}">Vocal exercises, set to your voice</span>
            </div>
            <span style="{{p.stampStyle}}">Range · A2 – E4</span>
          </div>
          <div style="{{p.controlsStyle}}">
            <span style="{{p.chipOn}}">All</span>
            <span style="{{p.chipOff}}">Warm-up</span>
            <span style="{{p.chipOff}}">Range</span>
            <span style="{{p.chipOff}}">Agility</span>
            <span style="{{p.countStyle}}">15 exercises</span>
          </div>
          <div style="padding: 22px 30px 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
            <sc-for list="{{p.tiles}}" as="t" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 8px">
                <svg viewBox="0 0 100 70" width="100%" aria-hidden="true" style="{{p.coverStyle}}">
                  <g stroke="{{p.rule}}" stroke-width="0.6"><line x1="6" y1="18" x2="94" y2="18"></line><line x1="6" y1="26" x2="94" y2="26"></line><line x1="6" y1="34" x2="94" y2="34"></line><line x1="6" y1="42" x2="94" y2="42"></line><line x1="6" y1="50" x2="94" y2="50"></line></g>
                  <path d="{{t.path}}" fill="none" stroke="{{t.color}}" stroke-width="2.6" stroke-linecap="square"></path>
                </svg>
                <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: {{t.color}}">{{t.cat}}</span>
                <span style="font-size: 15px; font-weight: 700; color: {{p.ink}}">{{t.title}}</span>
                <span style="display: flex; gap: 8px; align-items: center; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase"><span style="background: {{t.color}}; color: {{p.paper}}; padding: 3px 7px">Sing ▸</span><span style="color: {{p.ink2}}">{{t.tempo}} bpm</span></span>
              </div>
            </sc-for>
          </div>
          <div style="{{p.footStyle}}">
            <span style="{{p.ghostStyle}}">Edit a copy</span>
            <span>made by gjed</span>
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{p.swatches}}" as="s" hint-placeholder-count="7">
          <span style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #333333; width: 92px"><span style="{{s.style}}"></span>{{s.label}}<span style="color: #666666">{{s.hex}}</span></span>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1880,"height":1640}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      { name: 'A · Vermilion', note: 'pale peach desk, vermilion red, deep red-black band', desk: '#f4dcd0', paper: '#fff7f2', card: '#ffffff', ink: '#2a1512', ink2: '#74514a', rule: '#ecd3c8', site: '#c2321a', slab: '#3b1410', sink: '#fde9df', sacc: '#ff9b80' },
      { name: 'B · Tangerine', note: 'apricot desk, burnt orange, dark rust band', desk: '#fbd9b8', paper: '#fff8ef', card: '#ffffff', ink: '#2b1a10', ink2: '#7a5232', rule: '#f0d6bd', site: '#b84508', slab: '#4a1f08', sink: '#fff1e2', sacc: '#ffb26b' },
      { name: 'C · Tomato', note: 'coral blush desk, tomato red, the band itself is red', desk: '#f7d4cb', paper: '#fffaf7', card: '#ffffff', ink: '#2a1210', ink2: '#7a4a42', rule: '#f0d7d0', site: '#b3261e', slab: '#b3261e', sink: '#fff4ef', sacc: '#ffd3a8' },
      { name: 'D · Blood orange', note: 'bright orange band with dark type, red shadows', desk: '#fde0cc', paper: '#fff5ec', card: '#ffffff', ink: '#24110b', ink2: '#734a36', rule: '#f2d6c3', site: '#a8320c', slab: '#f97316', sink: '#1a0a04', sacc: '#4a1205' }
    ];
    const tilesBase = [
      { cat: 'Warm-up', title: 'Siren', tempo: 60, path: 'M8 54L50 22L92 54', c: '#a14a0c' },
      { cat: 'Range', title: 'Major arpeggio', tempo: 100, path: 'M8 54L22 54L22 46L36 46L36 38L50 38L50 46L64 46L64 54L92 54', c: '#2f5fa8' },
      { cat: 'Agility', title: 'Five-note scale', tempo: 120, path: 'M8 54L16 54L16 50L24 50L24 46L32 46L32 42L40 42L40 38L48 38L48 42L56 42L56 46L64 46L64 50L72 50L72 54L92 54', c: '#2e7a4c' }
    ];
    const palettes = P.map(p => ({
      ...p,
      tiles: tilesBase.map(t => ({ ...t, color: t.c })),
      deskStyle: 'background: ' + p.desk + '; padding: 22px',
      sheetStyle: 'background: ' + p.paper + '; color: ' + p.ink + '; border: 1.5px solid ' + p.ink + '; box-shadow: 0 16px 36px rgba(0,0,0,0.18); overflow: hidden',
      mastStyle: 'display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1.5px solid ' + p.ink,
      tagStyle: 'font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + p.site,
      navStyle: 'font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: ' + p.ink2,
      slabStyle: 'position: relative; overflow: hidden; background: ' + p.slab + '; padding: 30px 30px 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px',
      staffStyle: 'position: absolute; left: 0; right: 0; top: 22px; height: 73px; background: repeating-linear-gradient(to bottom, ' + (p.sink === '#1a0a04' ? 'rgba(26,10,4,0.12)' : 'rgba(255,240,230,0.1)') + ' 0 1px, transparent 1px 18px)',
      kickerStyle: 'font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: ' + p.sacc,
      titleStyle: 'font: 400 36px/1.04 \'Special Elite\', monospace; color: ' + p.sink,
      stampStyle: 'position: relative; border: 2px solid ' + p.sacc + '; color: ' + p.sacc + '; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 6px 10px; transform: rotate(-2deg); white-space: nowrap',
      controlsStyle: 'display: flex; gap: 7px; align-items: center; padding: 16px 30px; border-bottom: 1.5px solid ' + p.ink,
      chipOn: 'font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 9px; border: 1.5px solid ' + p.site + '; background: ' + p.site + '; color: ' + p.paper,
      chipOff: 'font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 9px; border: 1.5px solid ' + p.rule + '; color: ' + p.ink2,
      countStyle: 'margin-left: auto; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: ' + p.ink2,
      coverStyle: 'display: block; background: ' + p.card + '; border: 1.5px solid ' + p.ink + '; box-shadow: 4px 4px 0 ' + p.site,
      footStyle: 'display: flex; justify-content: space-between; align-items: center; margin: 0 30px; padding: 12px 0 18px; border-top: 1.5px solid ' + p.ink + '; font-size: 10.5px; letter-spacing: 0.1em; color: ' + p.ink2,
      ghostStyle: 'font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: ' + p.site + '; border: 1px solid ' + p.site + '; padding: 7px 10px',
      swatches: [['Desk', p.desk], ['Paper', p.paper], ['Ink', p.ink], ['Ink 2', p.ink2], ['Site', p.site], ['Band', p.slab], ['Band accent', p.sacc]].map(([l, h]) => ({ label: l, hex: h, style: 'display: block; height: 36px; border: 1px solid rgba(0,0,0,0.2); background: ' + h }))
    }));
    return { palettes };
  }
}
</script>
</body>
</html>
